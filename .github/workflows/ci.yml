# Quality gate: lint + unit tests on every PR and push to main.
# Runs BEFORE anything ships — the deploy workflow is tag-driven, so keeping
# main green here is what stands between a regression and an image build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin ruff: unpinned, `pip install ruff` pulls the latest, and ruff promotes
          # whole rule families into its default set between releases (0.6 -> 0.16 added
          # B/BLE/I/UP/SIM/... by default). This repo lints against the DEFAULT ruleset
          # (no `select`; `ignore` lists only E-codes), so an auto-upgrade turns CI red
          # repo-wide on rules never opted into. Pin to the baseline the tree is clean on.
          pip install pytest "ruff==0.6.9"
          # The extraction extra (PyMuPDF). requirements.txt is the DEPLOYED set and must
          # not carry a build-time parser, but without it tests/test_*.py touching the
          # pipeline die at import with ModuleNotFoundError: fitz — five modules did.
          pip install "pymupdf>=1.24"   # == the `extract` extra in pyproject.toml

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest (unit)
        run: pytest -q
